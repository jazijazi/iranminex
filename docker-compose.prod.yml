x-logging: &default-logging
  # Ship every container's stdout/stderr to the host's journald instead of
  # Docker's default json-file driver (which has no rotation configured here
  # and would otherwise grow forever on disk).
  # tag sets both CONTAINER_TAG and SYSLOG_IDENTIFIER in journald to the
  # container name (e.g. m45_django_web), so you can filter with:
  #   journalctl -t m45_django_web -f
  #   journalctl CONTAINER_NAME=geoserver --since today
  driver: journald
  options:
    tag: "{{.Name}}"

x-common-labels: &common-labels
  com.m45.project: iranminex
  com.m45.environment: production

services:
  db:
    build:
      context: ./postgredb
      dockerfile: ./Dockerfile
    container_name: iranminex_postgis_db
    labels: *common-labels
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Add the SECRET_KEY as PostgreSQL configuration
      PGOPTIONS: "-c app.jwt_secret=${SECRET_KEY}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - iranminexnet
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    container_name: iranminex_pgbouncer
    labels: *common-labels
    ports:
      - "5432:5432"
    environment:
      DB_HOST: 172.16.3.16
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 5
      MAX_DB_CONNECTIONS: 50
      MAX_USER_CONNECTIONS: 50
      AUTH_TYPE: scram-sha-256
    networks:
      - iranminexnet
        #depends_on:
      #db:
      #condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "env pg_isready -h localhost -p 5432 -U $POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  redis:
    image: redis:8.0.1-alpine
    container_name: iranminex_redis
    labels: *common-labels
      #ports:
      # - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    env_file:
      - .env
    networks:
      - iranminexnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    command: >
      redis-server 
      --appendonly yes 
      --appendfsync everysec
      --maxmemory-policy allkeys-lru
    logging: *default-logging

  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: iranminex_martin
    labels: *common-labels
    expose:
      - "3000"
    env_file:
      - .env
    volumes:
      - ./martin/config-prod.yaml:/config.yaml:ro
    command: ["--config", "/config.yaml", "--webui", "disable"]
    networks:
      - iranminexnet
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - pgbouncer
    restart: unless-stopped
    logging: *default-logging

  web:
    build:
      context: ./backend
      dockerfile: ./Dockerfile.prod
      args:
        UID: ${UID}   # host UID
        GID: ${GID}   # host GID
    container_name: iranminex_web
    labels: *common-labels
    user: "${UID}:${GID}"
    command: ["/app/startup.sh"]
    volumes:
      - ${RASTER_ROOT}:${RASTER_ROOT} 
      - ${MEDIA_ROOT}:${MEDIA_ROOT} 
      - ${STATIC_ROOT}:${STATIC_ROOT} 
      - ${LOGS_ROOT}:${LOGS_ROOT}
      - /var/mediabck/:/var/mediabck/
      - /var/raster:/var/raster
        #- /var/mediabck:/var/mediabck
      # - "/var/frontend:/var/www/iranminex"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/common/healthcheck/"]
      interval: 40s
      timeout: 20s
      retries: 8
      start_period: 60s
    logging: *default-logging
    expose:
      - "8000"
    env_file:
      - .env
    networks:
      - iranminexnet
    depends_on:
        #- db
      - redis


  titiler:
    build:
      context: ./titiler
      dockerfile: Dockerfile.prod
      args:
        UID: ${UID}   # host UID
        GID: ${GID}   # host GID
    container_name: iranminex_titiler
    labels: *common-labels
      #ports:
      #- "8008:8008"
    expose:
      - "8001"
    environment:
      - TITILER_HOST=0.0.0.0
      - TITILER_PORT=8001
      - TITILER_ROOT_PATH=/maprasterservice
      - FORWARDED_ALLOW_IPS=*
        #- TITILER_ROOT_PATH=${TITILER_ROOT_PATH}        
    command: ["/starttitiler.sh"]
      #depends_on:
      #- db
    env_file:
      - .env 
    networks:
      - iranminexnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped
    volumes:
      - ${RASTER_ROOT}:/app/raster

  nginx:
    image: nginx:1.28.0-alpine3.21
    container_name: iranminex_nginx
    labels: *common-labels
    ports:
      - 80:80 
      - 443:443
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ${SSL_DIR}:/etc/nginx/ssl  # For SSL certificates
      - ${RASTER_ROOT}:${RASTER_ROOT} 
      - ${MEDIA_ROOT}:${MEDIA_ROOT} 
      - ${STATIC_ROOT}:${STATIC_ROOT}
      - /appdata/googlesat:/appdata/googlesat
      - /appdata/etm8:/appdata/etm8
      - ${FRONT_ROOT}:/var/www/iranminex
      - ${GLYPHS_ROOT}:/var/iranminex/glyphs
      - ${DOCS_ROOT}:/var/www/docs
    networks:
      - iranminexnet
    logging: *default-logging
    depends_on:
      - web
      - martin
    restart: unless-stopped

networks:
  iranminexnet:
    name: iranminexnet
    driver: bridge

volumes:
  #pgdata:
  #driver: local
  redis_data:
     driver: local
