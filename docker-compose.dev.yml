  db:
    build:
      context: ./postgredb
      dockerfile: ./Dockerfile
    container_name: iranminex_postgis_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Add the SECRET_KEY as PostgreSQL configuration
      PGOPTIONS: "-c app.jwt_secret=${SECRET_KEY}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - iranminexnet
    ports:
      - ${POSTGRES_PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8.0.1-alpine
    container_name: iranminex_redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    env_file:
      - .env
    networks:
      - iranminexnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    command: >
      redis-server 
      --appendonly yes 
      --appendfsync everysec
      --maxmemory-policy allkeys-lru

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: iranminex_redisinsight
    ports:
      - "8001:5540"          # Expose the RedisInsight UI
    networks:
      - iranminexnet
    restart: unless-stopped
    volumes:
      - redisinsight:/data

  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: iranminex_martin
    depends_on:
      - db
    ports:
      - "3001:3000"
    env_file:
      - .env
    volumes:
      - ./martin/config-dev.yaml:/config.yaml:ro
    command: ["--config", "/config.yaml", "--webui", "enable-for-all"]
    networks:
      - iranminexnet
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  titiler:
    build:
      context: ./titiler
      dockerfile: Dockerfile.dev
    container_name: iranminex_titiler
    ports:
      - "8008:8008"
    environment:
      - TITILER_HOST=0.0.0.0
      - TITILER_PORT=8008
      # - TITILER_ROOT_PATH=/maprasterservice
      - TITILER_ROOT_PATH=/
    command: ["/starttitiler.sh"]
    depends_on:
      - db
    env_file:
      - .env 
    networks:
      - iranminexnet
    healthcheck:
      test: ["CMD", "sh", "-c", "curl", "-f", "-s", "http://${TITILER_HOST}:${TITILER_PORT}${TITILER_ROOT_PATH}" , "||" , "exit" , "1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    volumes:
      - ${RASTER_ROOT}:/app/raster


